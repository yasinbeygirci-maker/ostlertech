# Argus — Faz 4 CI Secret-Scan (2026-09-16)
# Her push ve PR'da tüm git geçmişini tarar; sızma (API anahtarı, token, şifre)
# bulunursa pipeline BAŞARISIZ biter — merge/publish öncesi kapı.
# Not: Gitleaks Action kişisel hesaplarda ücretsizdir (GITLEAKS_LICENSE yalnız org'lar için).

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks sızma taraması
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu tam geçmişle çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks tüm commit geçmişini tarar

      - name: Sızma taraması
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # kişisel hesapta boş kalabilir
        with:
          # Bulgu olursa adım başarısız olur → pipeline durur (planın 3. maddesi)
          args: --verbose --redact --exit-code 1
