<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OstlerTech">
  <!-- OstlerTech sembolü: halka + dört kollu yönlü yıldız, ortada boş elmas. Tam simetrik, düz iki ton. -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <!-- Her kol eksenden ikiye bölünür: bir yarısı beyaz, diğeri açık mavi-gri (derinlik). Orta elmas boş kalır. -->
  <g>
    <!-- Kuzey -->
    <polygon points="256,92 256,190 196,196" fill="#FFFFFF"/>
    <polygon points="256,92 316,196 256,190" fill="#9FB3D1"/>
    <!-- Doğu -->
    <polygon points="420,256 322,256 316,196" fill="#FFFFFF"/>
    <polygon points="420,256 316,316 322,256" fill="#9FB3D1"/>
    <!-- Güney -->
    <polygon points="256,420 256,322 316,316" fill="#FFFFFF"/>
    <polygon points="256,420 196,316 256,322" fill="#9FB3D1"/>
    <!-- Batı -->
    <polygon points="92,256 190,256 196,316" fill="#FFFFFF"/>
    <polygon points="92,256 196,196 190,256" fill="#9FB3D1"/>
    <!-- Orta elmasın çerçevesi -->
    <polygon points="256,190 322,256 256,322 190,256" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="miter"/>
  </g>
</svg>
