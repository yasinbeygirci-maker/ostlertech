# Argus — Faz 4 CI Secret-Scan (2026-09-16, 17.09'da güncellendi)
# Her push ve PR'da tüm git geçmişini tarar; sızma (API anahtarı, token, şifre)
# bulunursa pipeline BAŞARISIZ biter — merge/publish öncesi kapı.
#
# 2026-09-17: gitleaks/gitleaks-action@v2 wrapper'ı lisans zorunluluğu getirdi
# (kişisel hesaplarda bile) ve 'args' girdisini kaldırdı → wrapper atılıp
# gitleaks CLI doğrudan çalıştırılıyor. Araç açık kaynak ve ücretsizdir.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks sızma taraması
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu tam geçmişle çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks tüm commit geçmişini tarar

      - name: Gitleaks CLI kur (v8.30.1)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks

      - name: Sızma taraması
        run: gitleaks detect --source . --verbose --redact --exit-code 1
